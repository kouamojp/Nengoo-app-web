<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>L'équipe Nengoo vous a répondu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 24px; border-radius: 8px; }
        h1 { color: #3b0764; font-size: 20px; }
        p { color: #444444; line-height: 1.6; }
        .message { white-space: pre-wrap; background-color: #f5f3ff; border-left: 4px solid #7e22ce; padding: 12px 16px; border-radius: 4px; color: #222222; }
        .button { display: inline-block; padding: 12px 22px; background-color: #7e22ce; color: #ffffff; text-decoration: none; border-radius: 999px; margin-top: 16px; font-weight: bold; }
        .footer { margin-top: 24px; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bonjour {{ name|e }},</h1>
        <p>L'équipe Nengoo vous a écrit :</p>
        <div class="message">{{ message|e }}</div>
        <a href="{{ url|e }}" class="button">Lire et répondre</a>
        <p>Vous pouvez aussi répondre depuis l'application Nengoo : Profil, puis « Écrire à l'équipe Nengoo ».</p>
        <p class="footer">&copy; Nengoo. Cet e-mail vous est envoyé parce que l'équipe vous a écrit dans votre espace Nengoo.</p>
    </div>
</body>
</html>
